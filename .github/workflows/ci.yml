name: Canonical Checks

on:
  push:
    branches:
      - main
      - master
      - work
  pull_request:

jobs:
  checksum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against merge conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if rg -n "<<<<<<<|=======|>>>>>>>" -g"*.yml" -g"*.yaml" .; then
            echo "Merge conflict markers detected in workflow files." >&2
            exit 1
          fi
      - name: Enforce LF line endings for checksum verification
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Verify checksum manifest is in sync
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/update_checksums.sh
          bash scripts/update_checksums.sh
          git diff --exit-code checksums.sha256
