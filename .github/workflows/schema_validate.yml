name: Schema Validation

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - work

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jsonschema
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install jsonschema

      - name: Validate semantic definitions JSON
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_path = Path('semantic-defs/TCT_Canonical-Semantic-Definitions_ID-EN_v1.0.schema.json')
          data_path = Path('semantic-defs/TCT_Canonical-Semantic-Definitions_ID-EN_v1.0.json')

          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          data = json.loads(data_path.read_text(encoding='utf-8'))

          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          errors = sorted(validator.iter_errors(data), key=lambda e: e.path)
          if errors:
              for err in errors:
                  path = '.'.join([str(p) for p in err.path])
                  print(f"Validation error at {path}: {err.message}")
              raise SystemExit(1)
          print('Schema validation passed.')
          PY
