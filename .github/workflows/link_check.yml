name: Link Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check external links
        run: |
          set -euo pipefail
          python3 scripts/check_links.py
