name: Bug report
description: Report a repository issue or metadata mismatch.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please provide enough detail so we can reproduce or verify it.
  - type: input
    id: affected_files
    attributes:
      label: Affected files
      description: List the file paths or URLs involved.
      placeholder: "README.md, semantic-defs/TCT_Canonical-Semantic-Definitions_ID-EN_v1.0.json"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce (if applicable)
      description: Provide steps to reproduce the issue.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or references
      description: Include logs, screenshots, or citations.
